name: CI

# Runs the checks on every push to main and on every pull request.
# Pull requests only get the checks. A push to main that passes every check is
# then deployed to the AWS server. The "Run workflow" button redeploys on demand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check every backend file
        run: |
          set -e
          count=0
          for f in $(find services api-gateway -name '*.js' -not -path '*/node_modules/*'); do
            node --check "$f"
            count=$((count + 1))
          done
          echo "Checked $count files, no syntax errors"

      - name: Unit tests
        run: node --test services/tally-service/test/archive.test.js

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build
        run: npm run build

  compose:
    name: Deployment config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.prod.yml
        env:
          DOMAIN: example.test
          POSTGRES_PASSWORD: ci-placeholder
          JWT_SECRET: ci-placeholder
          ADMIN_API_KEY: ci-placeholder
        run: docker compose -f docker-compose.prod.yml config --quiet

  deploy:
    name: Deploy to AWS
    needs: [backend, frontend, compose]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Never two deploys at once; a newer push waits for the running one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write   # lets this job request a short-lived AWS login from GitHub
      contents: read
    env:
      AWS_REGION: ap-south-1
      INSTANCE_ID: i-0c36d31c1c844125a
      ROLE_ARN: arn:aws:iam::614294917782:role/ballotique-github-deploy
      # What the server runs: remember the live commit, fetch the new code,
      # then hand over to deploy/deploy.sh (which validates, rebuilds,
      # health-checks and rolls back if needed).
      REMOTE_COMMAND: >-
        sudo -u ubuntu -H bash -c 'cd ~/ballotique &&
        export PREV_COMMIT=$(git rev-parse HEAD) &&
        git fetch --quiet origin main &&
        git reset --hard --quiet origin/main &&
        bash deploy/deploy.sh'
    steps:
      - name: DEBUG - show which identity GitHub presents to AWS
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          token = json.load(urllib.request.urlopen(req))["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print("GitHub tells AWS that this job is:")
          for key in ("sub", "aud", "repository", "ref", "iss"):
              print(f"  {key:<11}= {claims.get(key)}")
          PY
      - name: Sign in to AWS (short-lived, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy on the server through AWS Systems Manager
        run: |
          set -euo pipefail

          PARAMS=$(jq -nc --arg c "$REMOTE_COMMAND" '{commands: [$c]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 1800 \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)
          echo "Started command $CMD_ID - waiting for the server to finish..."

          STATUS=Pending
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          echo "----- server output -----"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          ERRORS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true)
          if [ -n "$ERRORS" ] && [ "$ERRORS" != "None" ]; then
            echo "----- server errors -----"
            echo "$ERRORS"
          fi
          echo "-------------------------"
          echo "Final status: $STATUS"
          [ "$STATUS" = "Success" ]