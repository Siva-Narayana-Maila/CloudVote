# Copy to /var/lib/rancher/k3s/server/manifests/traefik-config.yaml (k3s applies it
# automatically). Gives Traefik automatic Let's Encrypt certificates (HTTP-01, like Caddy did),
# a persistent store for them, and the HTTP -> HTTPS redirect.
# Replace EMAIL_PLACEHOLDER with your e-mail before copying.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    additionalArguments:
      - "--certificatesresolvers.le.acme.email=EMAIL_PLACEHOLDER"
      - "--certificatesresolvers.le.acme.storage=/data/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
    persistence:
      enabled: true
      path: /data
      size: 128Mi
    podSecurityContext:
      fsGroup: 65532
