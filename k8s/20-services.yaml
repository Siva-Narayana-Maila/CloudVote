apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: ballotique }
spec:
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, namespace: ballotique }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: { matchLabels: { app: api-gateway } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: ballotique/api-gateway:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - { name: PORT, value: "8080" }
            - { name: CORS_ORIGIN, value: "https://DOMAIN_PLACEHOLDER" }
            - { name: AUTH_SERVICE_URL, value: "http://auth-service:4001" }
            - { name: VOTING_SERVICE_URL, value: "http://voting-service:4002" }
            - { name: TALLY_SERVICE_URL, value: "http://tally-service:4003" }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { memory: 64Mi, cpu: 25m }
            limits: { memory: 256Mi }
---
apiVersion: v1
