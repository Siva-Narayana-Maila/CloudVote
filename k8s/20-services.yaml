# The five application workloads. IMAGE_TAG is replaced by deploy/deploy-k3s.sh with the
# current git commit, so every release is a new, traceable image.
# auth-service creates the database tables at start-up, so voting/tally wait for it
# (same ordering rule as depends_on in docker-compose.prod.yml).
---
apiVersion: v1
kind: Service
metadata: { name: auth-service, namespace: ballotique }
spec:
  selector: { app: auth-service }
  ports: [{ port: 4001, targetPort: 4001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: auth-service, namespace: ballotique }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: { matchLabels: { app: auth-service } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  template:
    metadata: { labels: { app: auth-service } }
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh","-c","until pg_isready -h postgres -U ballotique; do sleep 2; done"]
      containers:
        - name: auth-service
          image: ballotique/auth-service:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4001 }]
          envFrom:
            - secretRef: { name: ballotique-env }
          env:
            - { name: PORT, value: "4001" }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: ballotique-env, key: POSTGRES_PASSWORD } }
            - { name: DATABASE_URL, value: "postgres://ballotique:$(POSTGRES_PASSWORD)@postgres:5432/ballotique" }
          readinessProbe:
            httpGet: { path: /health, port: 4001 }
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /health, port: 4001 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { memory: 96Mi, cpu: 25m }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: voting-service, namespace: ballotique }
spec:
  selector: { app: voting-service }
  ports: [{ port: 4002, targetPort: 4002 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: voting-service, namespace: ballotique }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: { matchLabels: { app: voting-service } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  template:
    metadata: { labels: { app: voting-service } }
    spec:
      initContainers:
        - name: wait-for-auth
          image: busybox:1.36
          command: ["sh","-c","until wget -qO- http://auth-service:4001/health; do sleep 2; done"]
      containers:
        - name: voting-service
          image: ballotique/voting-service:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4002 }]
          envFrom:
            - secretRef: { name: ballotique-env }
          env:
            - { name: PORT, value: "4002" }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: ballotique-env, key: POSTGRES_PASSWORD } }
            - { name: DATABASE_URL, value: "postgres://ballotique:$(POSTGRES_PASSWORD)@postgres:5432/ballotique" }
            - { name: PUBLIC_BASE_URL, value: "https://DOMAIN_PLACEHOLDER" }
          readinessProbe:
            httpGet: { path: /health, port: 4002 }
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /health, port: 4002 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { memory: 96Mi, cpu: 25m }
            limits: { memory: 256Mi }
---
