server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Live results stream (Server-Sent Events). Must NOT be buffered, or the
    # browser receives nothing until the buffer fills. Listed before the
    # general /api/ block so it takes priority.
    location = /api/results/stream {
        resolver 127.0.0.11 valid=10s;
        set $upstream_gateway api-gateway:8080;
        proxy_pass http://$upstream_gateway$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        # Re-resolve the gateway's address on each request so rebuilding that
        # container alone never leaves nginx pointing at a stale IP.
        # $request_uri forwards the exact path+query the browser sent.
        resolver 127.0.0.11 valid=10s;
        set $upstream_gateway api-gateway:8080;
        proxy_pass http://$upstream_gateway$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}